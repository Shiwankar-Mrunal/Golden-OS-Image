    - name: Update all packages
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
      when: ansible_os_family is defined and ansible_os_family == "Debian"


    - name: Install base utilities
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - unzip
        state: present
      when: ansible_os_family is defined and ansible_os_family == "Debian"


    - name: Install chrony for time sync
      ansible.builtin.apt:
        name: chrony
        state: present
      when: ansible_os_family is defined and ansible_os_family == "Debian"


    - name: Enable and start chrony service
      ansible.builtin.service:
        name: chrony
        state: started
        enabled: true

    - name: Disable unused services
      ansible.builtin.service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop: "{{ unused_services }}"
      ignore_errors: yes

    - name: Verify package installation
      ansible.builtin.shell: |
        which curl && which wget && which unzip && chronyc tracking
      register: verification
      ignore_errors: yes

    - name: Display verification results
      ansible.builtin.debug:
        var: verification.stdout_lines
