name: Azure Packer Image Build

on:
  push:
    branches:
      - pipeline

#env:
  # PACKER_VERSION: "1.9.2"
  # IMAGE_VERSION: "1.0.${{ github.run_number }}"
  #CLOUD_PROVIDER: "azure"
  #OS_NAME: "ubuntu-20.04"
  #AZURE_LOCATION: "West Europe"
  #ANSIBLE_FORCE_COLOR: "true"
  # AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  # AZURE_SECRET: ${{ secrets.AZURE_SECRET }}
  # AZURE_TENANT: ${{ secrets.AZURE_TENANT }}
  # AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

permissions:
  id-token: write
  contents: read
        


jobs:
  packer-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------
      # Setup Packer
      # -------------------
      

      - name: Authenticate with Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


          

      # -------------------
      # Packer Init
      # -------------------
      - name: Install Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.9.0"
        
      - name: Validate Packer Configuration
        run: packer validate ubuntu-packer-test/

      - name: Packer Init
        run: |
          packer init ubuntu-packer-test/



      - name: Build image with Packer
        run: |
          packer build -var-file=ubuntu-packer-test/variables.pkr.hcl ubuntu-packer-test/
    

