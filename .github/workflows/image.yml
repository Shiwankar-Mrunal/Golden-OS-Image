name: Azure Packer Image Build

on:
  push:
    branches:
      - pipeline

permissions:
  id-token: write
  contents: read        

jobs:
  packer-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------
      # Setup Packer
      # -------------------     

      - name: Authenticate with Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
        
      # -------------------
      # Packer Init
      # -------------------
      - name: Install Packer
        uses: hashicorp/setup-packer@v3

      - name: Packer Init
        run: |
          packer init ubuntu-packer-test
        
      - name: Validate Packer Configuration
        run: packer validate ubuntu-packer-test

      
      - name: Build image with Packer
        run: |
          packer build ubuntu-packer-test