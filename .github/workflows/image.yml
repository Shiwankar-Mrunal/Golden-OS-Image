name: Azure Packer Image Build

on:
  push:
    branches:
      - pipeline
  workflow_dispatch:

env:
  PACKER_VERSION: "1.9.2"
  IMAGE_VERSION: "1.0.${{ github.run_number }}"
  CLOUD_PROVIDER: "azure"
  OS_NAME: "ubuntu-20.04"
  AZURE_LOCATION: "West Europe"
  ANSIBLE_FORCE_COLOR: "true"
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_SECRET: ${{ secrets.AZURE_SECRET }}
  AZURE_TENANT: ${{ secrets.AZURE_TENANT }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

permissions:
  id-token: write
  contents: read
        


jobs:
  packer-build:
    runs-on: ubuntu-latest

    steps:
      # -------------------
      # Checkout code
      # -------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # -------------------
      # Install Packer
      # -------------------
      - name: Setup Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: "1.10.0"

      # -------------------
      # Install Ansible
      # -------------------



      - name: Install Ansible (compatible with Ubuntu 20.04)
        run: |
          python3 -m pip install --upgrade pip
          pip install "ansible<2.17"


      # -------------------
      # Azure Login
      # -------------------
      # - name: Azure Login
      #   uses: azure/login@v2
      #   with:
      #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ secrets.AZURE_TENANT }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      #     client-secret: ${{ secrets.AZURE_SECRET }}

      # -------------------
      # Packer Init
      # -------------------
      - name: Packer Init
        run: |
          packer init ubuntu-packer-test/

      # -------------------
      # Packer Validate
      # -------------------
      - name: Packer Build Azure Image
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SECRET: ${{ secrets.AZURE_SECRET }}
          AZURE_TENANT: ${{ secrets.AZURE_TENANT }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_LOCATION: West Europe
          IMAGE_VERSION: 1.0.31
        run: |
          packer build \
            -var "client_id=${AZURE_CLIENT_ID}" \
            -var "client_secret=${AZURE_SECRET}" \
            -var "tenant_id=${AZURE_TENANT}" \
            -var "subscription_id=${AZURE_SUBSCRIPTION_ID}" \
            ubuntu-packer-test/

            

      # -------------------
      # Packer Build
      # -------------------
      - name: Packer Build Azure Image
        run: |
          packer build \
            -var "client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -var "client_secret=${{ secrets.AZURE_CLIENT_SECRET }}" \
            -var "tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -var "subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -var "resource_group_name=M-ResourceGroup" \
            -var "location=${AZURE_LOCATION}" \
            -var "vm_size=Standard_B2s" \
            -var "image_version=${IMAGE_VERSION}" \
            ubuntu-packer-test/
